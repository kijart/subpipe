name: Deploy to GitHub Pages

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Deploy from a version tag (x.y.z), not from branch '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "Deploying version $GITHUB_REF_NAME"

      - name: Assemble site
        run: |
          mkdir _site
          cp -R src/. _site/
          cp LICENSE _site/
          sed -i "s|<span id=\"version\">dev</span>|<span id=\"version\">$GITHUB_REF_NAME</span>|" _site/index.html
          grep -q "<span id=\"version\">$GITHUB_REF_NAME</span>" _site/index.html || {
            echo "::error file=src/index.html::Version placeholder <span id=\"version\">dev</span> not found."
            exit 1
          }

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
