name: Publish container image

# latest: every push to master that changes the image
# x.y.z, x.y, x: every x.y.z tag
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    # Only for master: GitHub does not evaluate path filters on tag pushes.
    # Keep in sync with the files the Dockerfile copies.
    paths:
      - Dockerfile
      - .dockerignore
      - container/**
      - src/**
      - LICENSE
      - .github/workflows/publish-image.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: subpipe
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set app version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=${GITHUB_SHA::7}
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 --read-only \
            --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges "$IMAGE_NAME:test"
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          # The same command the image's HEALTHCHECK runs (its first run waits for the interval).
          docker exec smoke wget -q -O /dev/null http://127.0.0.1:8080/healthz || { echo "::error::Health check failed"; exit 1; }
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>SubPipe</title>' || { echo "::error::index.html not served"; exit 1; }
          curl -fsS http://127.0.0.1:8080/ | grep -q "<span id=\"version\">$APP_VERSION</span>" || { echo "::error::Version $APP_VERSION not shown"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8080/js/app.js

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=SubPipe
            org.opencontainers.image.description=Browser-only subscription manager for NewPipe.
          annotations: |
            org.opencontainers.image.title=SubPipe
            org.opencontainers.image.description=Browser-only subscription manager for NewPipe.

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: VERSION=${{ env.APP_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
